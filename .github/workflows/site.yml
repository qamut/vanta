# Publica o site (site/) no GitHub Pages, com o instalador e o vídeo da última versão.
# Os binários não ficam no git: vêm dos anexos do release.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalador e vídeo da última versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/download
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p 'VANTA-Setup-*.exe' -D site/download
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p 'vanta.mp4' -D site/media
          ls -la site/download site/media
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
